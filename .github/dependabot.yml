version: 2
updates:
  # pnpm workspace (Dependabot has no separate `pnpm` ecosystem — `npm` detects pnpm-lock.yaml): root lockfile covers apps/* and packages/*, incl. the catalog in pnpm-workspace.yaml
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Berlin # CET/CEST
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Berlin # CET/CEST
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
