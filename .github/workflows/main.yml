name: CI/CD Pipeline

on:
  push:
    branches: ['**']

  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  checks: write
  id-token: write
  issues: write

env:
  HUSKY: "0"
  NODE_VERSION: "24"
  PNPM_VERSION: "10.33.2"
  PLAYWRIGHT_VERSION: "1.63.0"
  SCREENSHOT_COMMIT_MESSAGE: "🖼️ Update screenshots"

jobs:
  # ========================================
  # Setup & Check Triggers
  # ========================================
  setup:
    name: Setup & Check Triggers
    runs-on: ubuntu-latest
    outputs:
      should-update-screenshots: ${{ steps.check-screenshots.outputs.should_update }}
      should-skip-e2e: ${{ steps.check-e2e-skip.outputs.should_skip }}
      should-release-mcp: ${{ steps.check-mcp.outputs.should_release }}
      playwright-version: ${{ env.PLAYWRIGHT_VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check screenshot update trigger
        id: check-screenshots
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MSG" == *"[update-screenshots]"* ]]; then
            echo "should_update=true" >> $GITHUB_OUTPUT
            echo "✅ [update-screenshots] trigger found"
          else
            echo "should_update=false" >> $GITHUB_OUTPUT
          fi

      - name: Check E2E skip trigger
        id: check-e2e-skip
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MSG" == *"[skip-e2e]"* ]]; then
            echo "should_skip=true" >> $GITHUB_OUTPUT
            echo "✅ [skip-e2e] trigger found - will skip E2E tests"
            exit 0
          fi

          # Same range as the MCP check: whole branch vs main, or last commit on main
          MERGE_BASE=$(git merge-base origin/main HEAD 2>/dev/null || echo "")
          if [ -n "$MERGE_BASE" ] && [ "$MERGE_BASE" != "$(git rev-parse HEAD)" ]; then
            RANGE="${MERGE_BASE}..HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi

          # Anything that changes the built Storybook or the test run. Dependency
          # versions (incl. catalog and pnpm.overrides) all land in pnpm-lock.yaml.
          E2E_PATHS=(
            packages/design-system/src
            packages/design-system/.storybook
            packages/design-system/package.json
            packages/design-system/playwright.config.ts
            packages/design-system/rsbuild.config.ts
            packages/design-system/postcss.config.js
            packages/configs/playwright-config
            packages/configs/rsbuild-config
            packages/configs/tailwind-config
            package.json
            pnpm-workspace.yaml
            pnpm-lock.yaml
          )

          if git diff --quiet "$RANGE" -- "${E2E_PATHS[@]}"; then
            echo "should_skip=true" >> $GITHUB_OUTPUT
            echo "✅ No E2E-relevant changes ($RANGE) - will skip E2E tests"
          else
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Check MCP release trigger
        id: check-mcp
        run: |
          SHOULD_RELEASE="false"

          # Compare against the merge base with main to detect ALL branch changes
          MERGE_BASE=$(git merge-base origin/main HEAD 2>/dev/null || echo "")
          if [ -n "$MERGE_BASE" ] && [ "$MERGE_BASE" != "$(git rev-parse HEAD)" ]; then
            RANGE="${MERGE_BASE}..HEAD"
          else
            # On main branch, compare with previous commit
            RANGE="HEAD~1..HEAD"
          fi

          echo "Checking range: $RANGE"

          # Detect breaking changes (any type with !:, BREAKING CHANGE(S): footer) — same rule as pr-title.yml
          if git log "$RANGE" --pretty="%B" | grep -qE '^[a-z]+(\(.+\))?!:|^BREAKING CHANGES?:'; then
            echo "🔥 Breaking change detected — MCP release triggered"
            SHOULD_RELEASE="true"
          fi

          # Detect changes in mcp-core or mcp packages
          CHANGED_FILES=$(git diff --name-only "$RANGE")

          if echo "$CHANGED_FILES" | grep -qE "^packages/(mcp-core|mcp)/"; then
            echo "📦 MCP package changes detected — MCP release triggered"
            SHOULD_RELEASE="true"
          fi

          echo "should_release=$SHOULD_RELEASE" >> $GITHUB_OUTPUT

  # ========================================
  # Quality Checks (Parallel)
  # ========================================
  quality:
    name: Quality Check - ${{ matrix.check }}${{ matrix.shard && format(' ({0})', matrix.shard) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: lint
          - check: typecheck
          # Unit tests take ~3 min on a 4-vCPU runner; Rstest splits them by file
          - { check: test, shard: 1/3 }
          - { check: test, shard: 2/3 }
          - { check: test, shard: 3/3 }
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/configs/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.check }}
        run: |
          if [ "${{ matrix.check }}" = "test" ]; then
            # JUnit (packages/*/test-results/junit.xml) comes from @wallarm-org/rstest-config when CI is set
            pnpm test:run -- --shard=${{ matrix.shard }}
          else
            pnpm ${{ matrix.check }}
          fi

      - name: Upload unit test results
        if: always() && matrix.check == 'test'
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results-${{ strategy.job-index }}
          path: |
            packages/*/test-results/junit.xml
            apps/*/test-results/junit.xml
          if-no-files-found: ignore

  # ========================================
  # Build
  # ========================================
  build:
    name: Build Packages
    runs-on: ubuntu-latest
    needs: [setup, quality]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/configs/*/node_modules
            apps/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build --filter='!@wallarm-org/docs'

      - name: Verify Claude Design build
        run: |
          pnpm --filter @wallarm-org/design-system claude-design:verify
          pnpm --filter @wallarm-org/design-system test:claude-design

      - name: Build Storybook
        run: pnpm --filter=@wallarm-org/design-system build-storybook

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: packages/design-system/storybook-static
          retention-days: 7

      - name: Upload built packages artifact
        uses: actions/upload-artifact@v7
        with:
          name: built-packages
          path: |
            packages/*/dist
            packages/configs/*/dist
          retention-days: 1

  # ========================================
  # E2E Tests
  # ========================================
  e2e:
    name: E2E Tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.setup.outputs.playwright-version }}-noble
      options: --shm-size=2gb
    needs: [setup, build]
    if: |
      needs.setup.outputs.should-update-screenshots != 'true' &&
      needs.setup.outputs.should-skip-e2e != 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/configs/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build config packages
        run: pnpm --filter="./packages/configs/*" build

      - name: Download Storybook artifact
        uses: actions/download-artifact@v8
        with:
          name: storybook-static
          path: packages/design-system/storybook-static

      - name: Serve Storybook & Run E2E tests
        run: |
          # Set up directory structure for serving with /design-system/storybook/ base path
          mkdir -p storybook-serve/design-system/storybook
          cp -r packages/design-system/storybook-static/* storybook-serve/design-system/storybook/

          # Start HTTP server for Storybook
          pnpm exec http-server storybook-serve -p 6006 &

          # Wait for server to be ready
          timeout 60 bash -c 'until curl -fs http://localhost:6006/design-system/storybook/iframe.html; do sleep 1; done'

          # Run E2E tests
          cd packages/design-system
          pnpm exec playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }} --project=chromium
        env:
          CI: true
          STORYBOOK_URL: http://localhost:6006/design-system/storybook

      - name: Upload E2E test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-results-shard-${{ matrix.shard }}
          path: |
            packages/design-system/test-results/
            packages/design-system/playwright-report/
          if-no-files-found: ignore

  # ========================================
  # Report Unit Test Results
  # ========================================
  unit-test-report:
    name: Report Unit Test Results
    runs-on: ubuntu-latest
    needs: [quality]
    if: ${{ !cancelled() && needs.quality.result != 'skipped' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download unit test artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: unit-test-results-*
          path: unit-test-artifacts

      - name: Publish unit test results
        uses: dorny/test-reporter@v3
        with:
          name: Unit Test Results
          path: "unit-test-artifacts/**/junit.xml"
          reporter: java-junit
          fail-on-error: false

  # ========================================
  # Report E2E Test Results
  # ========================================
  e2e-report:
    name: Report E2E Results
    runs-on: ubuntu-latest
    needs: [e2e]
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download all E2E artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: e2e-results-*
          path: e2e-artifacts
          merge-multiple: false

      - name: Publish E2E test results
        uses: dorny/test-reporter@v3
        with:
          name: E2E Test Results
          path: "e2e-artifacts/**/junit.xml"
          reporter: java-junit
          fail-on-error: false

  # ========================================
  # E2E Update Screenshots
  # ========================================
  e2e-update-screenshots:
    name: Update Screenshots (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.setup.outputs.playwright-version }}-noble
      options: --shm-size=2gb
    needs: [setup, build]
    if: needs.setup.outputs.should-update-screenshots == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/configs/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build config packages
        run: pnpm --filter="./packages/configs/*" build

      - name: Download Storybook artifact
        uses: actions/download-artifact@v8
        with:
          name: storybook-static
          path: packages/design-system/storybook-static

      - name: Update screenshots
        run: |
          # Set up directory structure for serving with /design-system/storybook/ base path
          mkdir -p storybook-serve/design-system/storybook
          cp -r packages/design-system/storybook-static/* storybook-serve/design-system/storybook/

          # Start HTTP server for Storybook
          pnpm exec http-server storybook-serve -p 6006 &

          # Wait for server to be ready
          timeout 60 bash -c 'until curl -fs http://localhost:6006/design-system/storybook/iframe.html; do sleep 1; done'

          # Unset CI to allow snapshot creation
          unset CI

          # Update screenshots (exit code ignored - new snapshots cause non-zero exit)
          pnpm --filter=@wallarm-org/design-system exec playwright test \
            --shard=${{ matrix.shard }}/${{ strategy.job-total }} \
            --project=chromium \
            --update-snapshots || true
        env:
          STORYBOOK_URL: http://localhost:6006/design-system/storybook

      - name: Stage changed screenshots
        id: changed-screenshots
        shell: bash
        run: |
          # Only this shard's own new/modified snapshots get uploaded.
          # Uploading the full **/*.png glob (old behavior) makes every shard's
          # artifact overlap on files it never touched; when commit-screenshots
          # merges the shard artifacts with merge-multiple, a differing-size
          # duplicate can overwrite a file without truncating it, corrupting
          # the PNG (trailing garbage after IEND). Staging only this shard's
          # actual changes keeps the shard artifacts disjoint by construction
          # (Playwright shards by spec file, so two shards can't touch the
          # same snapshot). Paths are staged relative to packages/design-system
          # so the artifact layout matches what commit-screenshots expects.
          #
          # Explicit -C/safe.directory: this job's container runs each step via a
          # fresh `docker exec`, and git's repository auto-detection from cwd is
          # not reliable there (seen failing with "Not a git repository" even
          # though the checkout succeeded) - so point git at the workspace directly.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # core.quotePath=false: git's default quoting wraps non-ASCII filenames
          # in double quotes with octal-escaped bytes (e.g. an en dash "–" in a
          # test title becomes "...1XX\342\200\2235XX...png" in `git diff`/`ls-files`
          # output). The read/cp loop below takes that output literally, so with
          # the default quoting `cp` silently failed (no `set -e`) for every
          # screenshot whose name carried a non-ASCII character, and the step
          # still reported success - three baselines (ResponseCode, LineChart,
          # PieChart "Hovered" variants) went missing this way.
          git config --global core.quotePath false
          STAGING_DIR="$RUNNER_TEMP/changed-screenshots"
          mkdir -p "$STAGING_DIR"
          echo "dir=$STAGING_DIR" >> "$GITHUB_OUTPUT"

          failed=0
          while IFS= read -r f; do
            rel="${f#packages/design-system/}"
            mkdir -p "$STAGING_DIR/$(dirname "$rel")"
            if ! cp "$GITHUB_WORKSPACE/$f" "$STAGING_DIR/$rel"; then
              echo "::error::Failed to stage screenshot: $f"
              failed=1
            fi
          done < <(
            {
              git -C "$GITHUB_WORKSPACE" diff --name-only -- packages/design-system
              git -C "$GITHUB_WORKSPACE" ls-files --others --exclude-standard -- packages/design-system
            } | grep '\.png$'
          )
          exit "$failed"

      - name: Upload updated screenshots
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-shard-${{ matrix.shard }}
          path: ${{ steps.changed-screenshots.outputs.dir }}
          if-no-files-found: ignore
          retention-days: 1

  # ========================================
  # Commit Updated Screenshots
  # ========================================
  commit-screenshots:
    name: Commit Updated Screenshots
    runs-on: ubuntu-latest
    needs: [e2e-update-screenshots]
    if: always() && needs.e2e-update-screenshots.result == 'success'
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # main only accepts pushes from repo admins and this deploy key (ruleset)
          ssh-key: ${{ github.ref_name == 'main' && secrets.DEPLOY_KEY || '' }}
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download all screenshot artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: screenshots-shard-*
          merge-multiple: true
          path: packages/design-system

      - name: Check for changes
        id: changes
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No screenshot changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Screenshot changes detected:"
            git diff --cached --name-only
          fi

      - name: Commit and push screenshots
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git commit -m "${{ env.SCREENSHOT_COMMIT_MESSAGE }}"
          git push

      - name: Trigger verification run against updated screenshots
        # A deploy-key push to main triggers its own run, so dispatch only elsewhere
        if: steps.changes.outputs.has_changes == 'true' && github.ref_name != 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pushes made with GITHUB_TOKEN don't trigger new workflow runs (GitHub's
          # anti-recursion rule), so the screenshot commit above never gets a real
          # e2e pass on its own. Dispatch a fresh run explicitly instead:
          # workflow_dispatch has no head_commit, so should-update-screenshots
          # resolves to false and the normal `e2e` job verifies against the
          # baselines just committed, instead of the update job's --update-snapshots
          # run whose exit code is deliberately ignored.
          gh workflow run main.yml --ref "${{ github.ref_name }}"

  # ========================================
  # Release
  # ========================================
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [setup, build, e2e]
    # Job-level permissions replace the workflow defaults: semantic-release (contents, issues,
    # pull-requests), npm provenance (id-token), `gh workflow run deploy-site.yml` (actions)
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: write
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') &&
      needs.setup.outputs.should-update-screenshots != 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # main only accepts pushes from repo admins and this deploy key (ruleset);
          # semantic-release pushes over SSH via `repositoryUrl` in releaserc.mjs
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/configs/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download built packages artifact
        uses: actions/download-artifact@v8
        with:
          name: built-packages
          path: packages

      - name: Clean stale RC tags after force-push
        if: github.ref_name != 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin --tags --force
          git fetch origin refs/notes/semantic-release:refs/notes/semantic-release 2>/dev/null || true

          RC_SUFFIX="rc-$(echo '${{ github.ref_name }}' | sed 's/[\\/_]/-/g')"
          MERGE_BASE=$(git merge-base origin/main HEAD)
          BRANCH_NAME="${{ github.ref_name }}"
          echo "RC suffix: ${RC_SUFFIX}"
          echo "Merge base: ${MERGE_BASE}"

          # 1) Delete stale git tags (unreachable after rebase)
          TAGS=$(git tag -l "*-${RC_SUFFIX}.*")
          if [ -n "$TAGS" ]; then
            echo "Found RC tags:"
            for TAG in $TAGS; do
              TAG_COMMIT=$(git rev-list -n 1 "$TAG" 2>/dev/null || true)
              if [ -n "$TAG_COMMIT" ] && git merge-base --is-ancestor "$TAG_COMMIT" HEAD 2>/dev/null; then
                echo "  keep $TAG (reachable from HEAD)"
                continue
              fi
              echo "  delete $TAG (unreachable after rebase)"
              gh release delete "$TAG" --yes 2>/dev/null || true
              git push origin ":refs/tags/$TAG" 2>/dev/null || true
              git tag -d "$TAG" 2>/dev/null || true
            done
          fi

          # 2) Recover tags published to npm but missing from git
          for PKG in "@wallarm-org/design-system" "@wallarm-org/mcp" "@wallarm-org/migrator"; do
            case "$PKG" in
              @wallarm-org/mcp) TAG_PREFIX="mcp-v";;
              @wallarm-org/migrator) TAG_PREFIX="migrator-v";;
              *) TAG_PREFIX="v";;
            esac

            NPM_VERSIONS=$(npm view "$PKG" versions --json 2>/dev/null \
              | jq -r 'if type == "array" then .[] else . end' \
              | grep -- "-${RC_SUFFIX}\." || true)

            for VER in $NPM_VERSIONS; do
              TAG="${TAG_PREFIX}${VER}"
              if ! git tag -l "$TAG" | grep -q .; then
                echo "  restore $TAG → ${MERGE_BASE}"
                git tag "$TAG" "$MERGE_BASE"
              fi
            done
          done

          # 3) Ensure ALL RC tags have semantic-release channel notes
          NOTES_CHANGED=false
          for TAG in $(git tag -l "*-${RC_SUFFIX}.*"); do
            if ! git notes --ref semantic-release show "$TAG" &>/dev/null; then
              echo "  add note to $TAG"
              git notes --ref semantic-release add -f \
                -m "{\"channels\":[\"${BRANCH_NAME}\"]}" "$TAG"
              NOTES_CHANGED=true
            fi
          done

          if [ "$NOTES_CHANGED" = "true" ]; then
            echo "Pushing semantic-release notes to remote"
            git push origin refs/notes/semantic-release 2>/dev/null || true
          fi

      # Saved so "Check migrator release" can tell whether the design-system
      # release stamped packages/migrator/versions.json
      - name: Save pre-release HEAD
        id: pre-release
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Release design-system
        run: pnpm semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Must run before the migrator/mcp releases: their commits move HEAD off the v* tag
      - name: Deploy site for stable release
        if: github.ref_name == 'main'
        continue-on-error: true   # design-system is already on npm; never block migrator/mcp
        env:
          PRE_RELEASE_SHA: ${{ steps.pre-release.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          if [ -n "$TAG" ] && [ "$(git rev-parse HEAD)" != "$PRE_RELEASE_SHA" ]; then
            gh workflow run deploy-site.yml --ref main -f tag="$TAG" \
              || echo "::warning::site deploy dispatch failed; run: gh workflow run deploy-site.yml --ref main -f tag=$TAG"
          else
            echo "No stable design-system release in this run; skipping site deploy"
          fi

      # Not check-mcp's HEAD~1 message check: that misses cancelled runs and the
      # release after an [update-screenshots] bot commit
      - name: Check migrator release
        id: check-migrator
        env:
          PRE_RELEASE_SHA: ${{ steps.pre-release.outputs.sha }}
        run: |
          SHOULD_RELEASE=false
          LAST=$(git describe --tags --abbrev=0 --match 'migrator-v*' --exclude '*-*' 2>/dev/null || true)
          if ! git diff --quiet "$PRE_RELEASE_SHA" HEAD -- packages/migrator/versions.json; then
            echo "versions.json stamped by the design-system release"
            SHOULD_RELEASE=true
          elif [ -z "$LAST" ]; then
            echo "No stable migrator tag yet"
            SHOULD_RELEASE=true
          elif [ -n "$(git diff --name-only "$LAST"..HEAD -- packages/migrator)" ]; then
            echo "packages/migrator changed since $LAST"
            SHOULD_RELEASE=true
          fi
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Release migrator
        if: steps.check-migrator.outputs.should_release == 'true'
        working-directory: packages/migrator
        run: pnpm semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Release mcp
        if: needs.setup.outputs.should-release-mcp == 'true'
        working-directory: packages/mcp
        run: pnpm semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Runs alongside `release`, only on main and only when semantic-release will
  # cut a stable version (RC branches would overwrite the shared Figma mappings)
  publish-code-connect:
    name: Publish Code Connect
    runs-on: ubuntu-latest
    needs: [setup, build, e2e]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.build.result == 'success' &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') &&
      needs.setup.outputs.should-update-screenshots != 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for a releasable commit
        id: check
        run: |
          # Mirrors releaseRules in packages/configs/publishing/releaserc.mjs
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' --exclude '*-*' 2>/dev/null || true)
          RANGE=${LAST_TAG:+$LAST_TAG..}HEAD
          if git log "$RANGE" --format='%s%n%b' \
            | grep -qE '^(feat|fix|perf|revert)(\(.+\))?!?:|^[a-z]+(\(.+\))?!:|^BREAKING CHANGES?:'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "No releasable commits since ${LAST_TAG:-the first commit}, skipping"
          fi

      - name: Setup pnpm
        if: steps.check.outputs.release == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        if: steps.check.outputs.release == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Cache node_modules
        if: steps.check.outputs.release == 'true'
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/configs/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: steps.check.outputs.release == 'true'
        run: pnpm install --frozen-lockfile

      - name: Publish Code Connect
        if: steps.check.outputs.release == 'true'
        working-directory: packages/design-system
        run: pnpm code-connect:publish --skip-update-check
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
