# Builds the docs site and Storybook from a stable release tag and deploys
# both to GitHub Pages. Dispatched by main.yml's `release` job after a stable
# design-system release; run manually to redeploy or roll back:
#   gh workflow run deploy-site.yml --ref main -f tag=vX.Y.Z
# Always dispatch with `--ref main` (the github-pages environment allows only
# main); `inputs.tag` selects the code. This file runs from main against older
# tags, so keep its steps compatible with every deployable tag.
name: Deploy Site

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable design-system release tag (vX.Y.Z)
        required: true
        type: string

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  HUSKY: "0"
  NODE_VERSION: "24"
  PNPM_VERSION: "10.33.2"

jobs:
  deploy:
    name: Deploy docs and Storybook
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          # Tag history for the docs' "new" badges
          fetch-depth: 0

      - name: Check tag is deployable
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not a stable tag"; exit 1; }
          # Tags before the rename keep the site in apps/docs as @wallarm-org/docs
          for dir in apps/website apps/docs; do
            if test -f "$dir/scripts/check-build.ts"; then
              echo "SITE_DIR=$dir" >> "$GITHUB_ENV"
              echo "SITE_PKG=$(jq -r .name "$dir/package.json")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::$TAG has no docs site"; exit 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs site
        run: pnpm turbo run build --filter="$SITE_PKG..."

      - name: Check docs build output
        run: pnpm --filter "$SITE_PKG" check:build

      - name: Build Storybook
        run: pnpm --filter @wallarm-org/design-system build-storybook

      - name: Assemble site
        run: |
          mkdir -p site/storybook
          cp -r "$SITE_DIR"/doc_build/* site/
          cp -r packages/design-system/storybook-static/* site/storybook/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Publishes @wallarm-org/claude-design (the one-prompt Claude Design install) to
  # npm and attaches the export to the release. Syncing Wallarm's own artifact stays
  # manual (.claude/skills/claude-design-sync). No-ops on tags without the build.
  claude-design:
    name: Publish Claude Design export
    runs-on: ubuntu-latest
    # The docs site is already deployed by its own job; a failed export must not turn the run red
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          # build.ts reads git tags and commit info
          fetch-depth: 0

      - name: Check tag has the Claude Design build
        id: guard
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # Tags before the exporter became its own package build it from design-system.
          if test -f packages/claude-design/src/build.ts; then
            printf 'enabled=true\nout=packages/claude-design/.claude-design\n' >> "$GITHUB_OUTPUT"
          elif test -f packages/design-system/claude-design/build.ts; then
            printf 'enabled=true\nout=packages/design-system/.claude-design\n' >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$TAG predates the Claude Design build; nothing to attach"
          fi

      - name: Setup pnpm
        if: steps.guard.outputs.enabled == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        if: steps.guard.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build Claude Design export
        if: steps.guard.outputs.enabled == 'true'
        env:
          OUT: ${{ steps.guard.outputs.out }}
        run: |
          if [ "$OUT" = packages/claude-design/.claude-design ]; then
            pnpm turbo run export --filter=@wallarm-org/claude-design
          else
            pnpm --filter @wallarm-org/design-system build:claude-design
          fi

      # Before the release attach, so a missing GitHub release never blocks npm.
      - name: Publish to npm
        if: steps.guard.outputs.enabled == 'true'
        working-directory: packages/claude-design
        env:
          TAG: ${{ inputs.tag }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -f bin/claude-design.js || { echo "::notice::$TAG predates the npm package; nothing to publish"; exit 0; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::notice::$TAG is a pre-release; not publishing"; exit 0; }
          VERSION="${TAG#v}"
          if npm view "@wallarm-org/claude-design@$VERSION" version >/dev/null 2>&1; then
            echo "@wallarm-org/claude-design@$VERSION is already on npm"; exit 0
          fi
          npm pkg set version="$VERSION"
          # A redeploy or rollback of an older tag must not move `latest` backwards
          LATEST=$(npm view @wallarm-org/claude-design dist-tags.latest 2>/dev/null || true)
          DIST_TAG=latest
          if [ -n "$LATEST" ] && [ "$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -n1)" != "$VERSION" ]; then
            DIST_TAG=previous
          fi
          # pnpm rewrites workspace:/catalog: specs; prepack packs dist/ from the export above
          pnpm publish --no-git-checks --access public --tag "$DIST_TAG" \
            || { echo "::error::npm publish of @wallarm-org/claude-design@$VERSION failed; Claude Design prompts install ${LATEST:-nothing}"; exit 1; }

      - name: Package and attach to the release
        if: steps.guard.outputs.enabled == 'true'
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ steps.guard.outputs.out }}
        run: |
          gh release view "$TAG" >/dev/null \
            || { echo "::error::No GitHub release for $TAG; the export cannot be attached"; exit 1; }
          tar czf "claude-design-$TAG.tgz" -C "$OUT" project file-hashes.json summary.json
          gh release upload "$TAG" "claude-design-$TAG.tgz" --clobber
          cat "$OUT/summary.json" >> "$GITHUB_STEP_SUMMARY"
