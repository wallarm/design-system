<!-- @dsCard group="Brand" height=288 -->
<!doctype html>
<html><head><meta charset="utf-8">
</head><body>
<style>
  html, body { margin: 0; background: var(--color-bg-page-bg); }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--color-bg-page-bg); }
  .band { position: absolute; left: 0; top: 0; }
  .brand { fill: var(--color-w-orange-600); }
  .ink { fill: var(--color-text-primary); }
  .relief { fill: var(--color-w-orange-300); }
  .dot { fill: var(--color-slate-400); }
  .tile { rx: var(--radius-2); }
  .text { position: absolute; left: 40px; top: 152px; max-width: 880px; }
  .name { margin: 0; font-family: var(--font-sans-display); font-size: 64px; line-height: 0.95; font-weight: 600; letter-spacing: var(--tracking-6xl); color: var(--color-text-primary); }
  .tagline { margin: 8px 0 0; font-family: var(--font-sans); font-size: 14px; line-height: 20px; color: var(--color-text-secondary); }
</style>
<div class="cover">
  <svg class="band" width="960" height="120" viewBox="0 0 960 120" aria-hidden="true">
    <!--
      blocks: color-w-orange-600 384×56 and 128×120 (bleeds right), color-text-primary 256×80, color-w-orange-300 192×104; widths are multiples of spacing-128 / spacing-64.
      arrangement: a staircase rising left to right in 24px steps, echoing the Wallarm mark's stepped bands; top-band skeleton because the name is too wide for its zone.
      pattern: dot grid at a 24px pitch (spacing-24) — the AppShell frame paints a dot raster (app-shell-ambient-dots), the system's own texture for a precise, technical UI.
      scales: spacing-24 pitch and steps, spacing-128 / spacing-64 widths, radius-2 corners (the mark is sharp-edged).
    -->
    <g>
      <rect class="brand tile" x="0" y="64" width="384" height="56"/>
      <rect class="ink tile" x="384" y="40" width="256" height="80"/>
      <rect class="relief tile" x="640" y="16" width="192" height="104"/>
      <rect class="brand tile" x="832" y="0" width="128" height="120"/>
    </g>
    <g>
      <circle class="dot" cx="24" cy="16" r="2"/><circle class="dot" cx="48" cy="16" r="2"/><circle class="dot" cx="72" cy="16" r="2"/><circle class="dot" cx="96" cy="16" r="2"/><circle class="dot" cx="120" cy="16" r="2"/><circle class="dot" cx="144" cy="16" r="2"/><circle class="dot" cx="168" cy="16" r="2"/><circle class="dot" cx="192" cy="16" r="2"/><circle class="dot" cx="216" cy="16" r="2"/><circle class="dot" cx="240" cy="16" r="2"/><circle class="dot" cx="264" cy="16" r="2"/><circle class="dot" cx="288" cy="16" r="2"/><circle class="dot" cx="312" cy="16" r="2"/><circle class="dot" cx="336" cy="16" r="2"/><circle class="dot" cx="360" cy="16" r="2"/>
      <circle class="dot" cx="24" cy="40" r="2"/><circle class="dot" cx="48" cy="40" r="2"/><circle class="dot" cx="72" cy="40" r="2"/><circle class="dot" cx="96" cy="40" r="2"/><circle class="dot" cx="120" cy="40" r="2"/><circle class="dot" cx="144" cy="40" r="2"/><circle class="dot" cx="168" cy="40" r="2"/><circle class="dot" cx="192" cy="40" r="2"/><circle class="dot" cx="216" cy="40" r="2"/><circle class="dot" cx="240" cy="40" r="2"/><circle class="dot" cx="264" cy="40" r="2"/><circle class="dot" cx="288" cy="40" r="2"/><circle class="dot" cx="312" cy="40" r="2"/><circle class="dot" cx="336" cy="40" r="2"/><circle class="dot" cx="360" cy="40" r="2"/>
      <circle class="dot" cx="408" cy="16" r="2"/><circle class="dot" cx="432" cy="16" r="2"/><circle class="dot" cx="456" cy="16" r="2"/><circle class="dot" cx="480" cy="16" r="2"/><circle class="dot" cx="504" cy="16" r="2"/><circle class="dot" cx="528" cy="16" r="2"/><circle class="dot" cx="552" cy="16" r="2"/><circle class="dot" cx="576" cy="16" r="2"/><circle class="dot" cx="600" cy="16" r="2"/><circle class="dot" cx="624" cy="16" r="2"/>
    </g>
  </svg>
  <div class="text">
    <h1 class="name">Wallarm Design System</h1>
    <p class="tagline">A comprehensive design system and component library for Wallarm.</p>
  </div>
</div>
</body></html>
